- name: create ec2 and r53 records
  hosts: local
  connection: local
  vars:
    subnet_id: subnet-01e005a50f8f57308
    security_group_id: sg-032092c508b21d964
    ami_id: ami-0220d79f3f480ecf5
    instance_type: t3.micro
    instances:
    - mysql
    - backend
    - frontend
  tasks:
  - name: create ec2 instance
    amazon.aws.ec2_instance:
      name: "{{ item }}"
      subnet_id: "{{ subnet_id }}"
      security_group: "{{ sg_id }}"
      image_id: "{{ ami_id }}"
      instance_type: "{{ instance_type }}"
    loop: "{{ instances }}"
     
